services:
  dataplane:
    build:
      context: .
      dockerfile: docker/dataplane.Dockerfile
    container_name: phantom-dataplane
    restart: unless-stopped
    ports:
      - "1053:1053/udp"
      - "1053:1053/tcp"
      - "9153:9153"
    cap_add:
      - NET_BIND_SERVICE # allow binding to low ports
    networks:
      - phantom-net
    environment:
      - CONTROLPLANE_ADDR=phantom-controlplane:50051
      # The dataplane's default (127.0.0.1:9153) is loopback-only, which the
      # "9153:9153" port mapping above cannot reach: Docker's published ports
      # forward to the container's network interface, not its loopback. Bind
      # 0.0.0.0 explicitly here so the mapping to the host works as intended.
      - METRICS_LISTEN_ADDR=0.0.0.0:9153
    volumes:
      - ./data:/app/data
      - ./configs/config.yaml:/app/configs/config.yaml
      - ./configs/policies.json:/app/configs/policies.json

  controlplane:
    depends_on:
      - dataplane
    build:
      context: .
      dockerfile: docker/controlplane.Dockerfile
    container_name: phantom-controlplane
    restart: unless-stopped
    ports:
      - "8086:8080"
      - "50051:50051"
    networks:
      - phantom-net
    environment:
      - DATAPLANE_GRPC_ADDR=phantom-dataplane:50051
    volumes:
      - ./data:/app/data
      - ./configs/config.yaml:/app/configs/config.yaml

  debugger:
    build:
      context: .
      dockerfile: docker/debugger.Dockerfile
    container_name: phantom-debugger
    stdin_open: true
    tty: true
    volumes:
      - ./data:/app/data
      - ./configs/config.yaml:/app/configs/config.yaml

networks:
  phantom-net:
    driver: bridge

name: 🔍 CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  GO_VERSION: '1.25'

jobs:
  # Code Quality Checks
  lint:
    name: 🔧 Code Linting
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v7

    - name: 🔧 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: 📋 Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.64.8
        args: --timeout=5m

  # Security Scanning
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v7

    - name: 🔧 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: 🔒 Run Gosec Security Scanner
      uses: securego/gosec@v2.28.0
      with:
        args: ./...

  # Build and Test
  test:
    name: 🧪 Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # go.mod's minimum (go directive) plus the latest stable Go release
        go-version: ['1.25', '1.26']
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v7

    - name: 🔧 Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: 📦 Download dependencies
      run: go mod download

    - name: 🔍 Verify dependencies
      run: go mod verify

    - name: 🏗️ Build binaries
      run: |
        go build -v -o bin/controlplane ./cmd/controlplane
        go build -v -o bin/dataplane ./cmd/dataplane

    - name: 🧪 Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: 📊 Upload coverage to Codecov
      if: matrix.go-version == '1.25'
      uses: codecov/codecov-action@v7
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: 🔍 Run go vet
      run: go vet ./...

  # Docker Build Test
  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v7

    - name: 🔧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🐳 Build Control Plane Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/controlplane.Dockerfile
        push: false
        tags: phantomcore/controlplane:test

    - name: 🐳 Build Data Plane Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/dataplane.Dockerfile
        push: false
        tags: phantomcore/dataplane:test

    - name: 🧪 Test Docker Compose
      run: |
        docker compose -f compose.yaml config
        echo "✅ Docker Compose configuration is valid"

  # Dependency Check
  deps:
    name: 📦 Dependency Check
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v7

    - name: 🔧 Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: 📦 Check for vulnerabilities
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

# local_only: data-custody master switch (I-061).
# When true, all non-resolution outbound ("phone-home") calls are disabled:
# telemetry, update checks, crash reporting, remote config, heartbeats.
# Core DNS resolution and operator-configured blocklist fetches still work.
# Overridable at runtime via the LOCAL_ONLY environment variable. Default: false.
local_only: false

dataplane:
  listen_addr: "0.0.0.0:1053"
  upstream_resolvers:
    # Plain UDP/TCP (default). Optionally prefix with "udp://".
    - "8.8.8.8:53"
    - "1.1.1.1:53"
    # Encrypted upstreams are opt-in per resolver:
    #   - "tls://1.1.1.1:853"                     # DNS-over-TLS (DoT)
    #   - "https://cloudflare-dns.com/dns-query"  # DNS-over-HTTPS (DoH)
  anonymization:
    secret: "${PHANTOM_ANON_SECRET:-change-me-in-production}"
  blocklist_update_interval: "6h"
  # Threat-score enforcement for the heuristic detector (DGA / entropy / tunneling).
  # 0 disables enforcement — the detector still scores and logs (historical default).
  # Set a value in (0, 1], e.g. 0.8, to block queries scored at or above it.
  # threat_block_dryrun logs would-be blocks without blocking (safe rollout).
  # Env overrides: THREAT_BLOCK_THRESHOLD, THREAT_BLOCK_DRYRUN.
  threat_block_threshold: 0
  threat_block_dryrun: false
  # Reject upstream answers that map a public name to a private/loopback/
  # link-local IP (DNS rebinding defense). Env override: REBIND_PROTECTION.
  rebind_protection: false
  # Optional per-client DNS query rate limit (queries/sec per client IP).
  # 0 disables it (default). Env override: CLIENT_RATE_LIMIT_PER_SEC.
  client_rate_limit_per_sec: 0
  # Rewrite well-known search/video hosts to their enforced-safe targets
  # (Google/Bing/DuckDuckGo SafeSearch, YouTube Restricted Mode). Env: SAFE_SEARCH.
  safe_search: false
  # Enable DNS 0x20 case-randomization on outbound upstream queries
  # (anti-spoofing hardening). Default false. Env override: DNS_0X20.
  dns_0x20: false
  # Address for the Prometheus /metrics endpoint (defaults to 0.0.0.0:9153).
  metrics_addr: "0.0.0.0:9153"
  # Bounded async query-log writer: buffer capacity and worker count. Once the
  # buffer is full, new rows are dropped and counted (see the
  # hydradns_dns_querylog_dropped_total metric) rather than blocking DNS
  # resolution. <= 0 (default) uses the package defaults: 1024 / 2.
  # Env overrides: QUERY_LOG_BUFFER_SIZE, QUERY_LOG_WORKERS.
  query_log_buffer_size: 1024
  query_log_workers: 2
  # Self-heal watchdog: probe cadence and consecutive-failure threshold before
  # recovery. Set watchdog_interval to "off" or "0" to disable. Overridable via
  # WATCHDOG_INTERVAL / WATCHDOG_FAILURE_THRESHOLD env vars.
  watchdog_interval: "30s"
  watchdog_failure_threshold: 3
  # Typosquat / homoglyph detection against a protected-brand watchlist.
  # Empty list (default) = OFF. Also settable via env: TYPOSQUAT_BRANDS
  # (comma-separated) and TYPOSQUAT_BLOCK (true/false).
  # typosquat_brands:
  #   - "paypal.com"
  # typosquat_block: false
  # Optional ASN/GeoIP answer filtering. Disabled unless db_path points at a
  # MaxMind-format database. Also configurable via env: GEOIP_DB_PATH,
  # BLOCKED_ASNS (comma ints), BLOCKED_COUNTRIES (comma ISO codes), GEOIP_BLOCK.
  # geoip:
  #   db_path: "/app/data/GeoLite2-ASN.mmdb"
  #   blocked_asns: [64500]
  #   blocked_countries: ["RU", "KP"]
  #   block: false   # false = flag only (default), true = block the answer
  grpc_server:
    port: 50051
    listen_addr: "localhost:50051"

controlplane:
  listen_addr: "0.0.0.0:8080"
  # Address of the dataplane's gRPC server (resolver live-apply, DNS engine
  # on/off toggle, live metrics). This is the control plane's DIAL address,
  # not the dataplane's bind address above (dataplane.grpc_server.listen_addr)
  # — they are the same value on bare metal but must differ whenever the two
  # planes run in separate containers/hosts, since "localhost" inside the
  # control plane is the control plane, not the dataplane. In docker compose,
  # set this to the dataplane service's address (e.g. "dataplane:50051").
  # Env override: DATAPLANE_GRPC_ADDR.
  dataplane_grpc_addr: "localhost:50051"
  # Optional HTTPS for the control-plane API. HTTP is the default (TLS off).
  # Public ACME cannot issue for private-LAN names, so use either an
  # operator-provided cert/key pair, or an auto-generated self-signed cert.
  # tls:
  #   # Provided cert/key (both must be set to serve HTTPS):
  #   cert_file: "/etc/hydra/tls/server.crt"  # env: TLS_CERT_FILE
  #   key_file: "/etc/hydra/tls/server.key"   # env: TLS_KEY_FILE
  #   # Or auto-generate a self-signed cert on first boot:
  #   auto_self_signed: false                 # env: TLS_AUTO_SELF_SIGNED
  #   self_signed_dir: "/app/data/tls"        # env: TLS_SELF_SIGNED_DIR

# Managed-service licensing (SOFT gate — premium/managed features + support only).
# Core DNS resolution/filtering ALWAYS works regardless of license state; a
# missing or expired license simply runs the install in "community" mode.
# Provide a signed license token via one of these environment variables:
#   LICENSE_KEY  - the raw signed license token (takes precedence)
#   LICENSE_FILE - path to a file containing the token
# See internal/license for the token format and validation details.
